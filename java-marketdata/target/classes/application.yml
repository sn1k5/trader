server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cpptrader_marketdata?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    caffeine:
      spec: maximumSize=100,expireAfterWrite=5s

jwt:
  secret: Y3BwdHJhZGVyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9u

matching:
  engine:
    host: 38.76.219.145
    port: 50059
    backend: netty
    heartbeat-interval-sec: 30
    heartbeat-timeout-sec: 60

marketdata:
  max-depth: 10
  trade-history-size: 1000
  kline:
    periods: 1m,5m,15m,1h,1d
    redis-ttl-minutes: 1440

logging:
  level:
    com.cpptrader.marketdata: DEBUG
