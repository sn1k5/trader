server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cpptrader?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    # 如果 RabbitMQ 未启动，设置为 false 禁用 RabbitMQ 功能
    enabled: true
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
    template:
      retry:
        enabled: true
        initial-interval: 2000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2
    # 启用自动声明队列、交换器和绑定
    dynamic: true

jwt:
  secret: Y3BwdHJhZGVyLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9u
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

risk:
  default:
    single-limit: 100000
    daily-limit: 1000000
    position-limit: 10000
    freq-limit: 60

stp:
  default-policy: REJECT_NEW
  enabled: true

protocol:
  host: 38.76.219.145
  port: 8080
  backend: netty
  tcp:
    host: 38.76.219.145
    port: 8080
  dpdk:
    localIp: 0.0.0.0
    localPort: 0
    remoteIp: 38.76.219.145
    remotePort: 8080
  heartbeat:
    intervalSec: 30
    timeoutSec: 60
  cpp:
    apiKeyId: ""
    apiKeySecret: ""
    authTimeoutSec: 5

logging:
  level:
    com.cpptrader.admin.protocol: DEBUG
    io.netty: DEBUG
